[project]
name = "agentic-systems"
version = "0.1.0"
description = "Hands-on, zero-to-production engineering curriculum for Agentic Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Module 01: Core Loop & Tool Calling
m01 = [
    "openai>=1.50.0",  # standard client used for OpenAI, Groq, Ollama compatible endpoints
]

# Module 02: Orchestration & State Machines
m02 = [
    "pydantic-ai>=0.0.18",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.0",
]

# Module 03: Protocol Layer & MCP
m03 = [
    "mcp>=1.1.2",
    "fastmcp>=0.4.0",
]

# Module 04: Harness & Memory
m04 = [
    "mem0ai>=0.1.20",
    "chromadb>=0.5.5",
]

# Module 05: Durability & Gateway
m05 = [
    "litellm>=1.50.0",
    "temporalio>=1.7.0",
]

# Module 06: Observability & Evaluation
m06 = [
    "langfuse>=2.50.0",
    "openllmetry>=0.1.0",
    "arize-phoenix>=4.0.0",
    "inspect-ai>=0.3.50",
]

# All dependencies combined
all = [
    "openai>=1.50.0",
    "pydantic-ai>=0.0.18",
    "langgraph>=0.2.35",
    "mcp>=1.1.2",
    "fastmcp>=0.4.0",
    "litellm>=1.50.0",
    "langfuse>=2.50.0",
    "inspect-ai>=0.3.50",
]

[tool.pytest.ini_options]
testpaths = ["modules"]
python_files = "test_*.py"
